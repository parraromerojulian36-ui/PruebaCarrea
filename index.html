<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b1020">
    <meta name="description" content="Carrera Geo-AR: juego de realidad aumentada con puntos GPS construido con A-Frame y AR.js.">
    <title>Geo-AR Carrera</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- AR.js fijado a una version estable (antes se cargaba "master", que puede cambiar) -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/aframe/build/aframe-ar-nft.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="status-bar">Cargando...</div>

    <div id="info-box" role="dialog" aria-modal="true" aria-labelledby="info-title">
        <h3 id="info-title">Punto</h3>
        <p id="info-text"></p>
        <button id="info-close">Cerrar</button>
    </div>

    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        cursor="rayOrigin: mouse"
        raycaster="near: 0; far: 50000"
        arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
        renderer="antialias: true; alpha: true">

        <a-camera gps-camera="gpsMinDistance: 5" rotation-reader></a-camera>
    </a-scene>

    <script src="main.js"></script>
</body>
</html>
